name: CI

on:
  push:
  pull_request:

jobs:
  # Full build (game + tests) on both target platforms, warnings treated as errors.
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # raylib's GLFW backend needs X11 and OpenGL development headers on Linux.
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGRIDIRON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  # Proves the architecture rule: game logic builds and passes its tests without raylib
  # (no X11/OpenGL packages are installed in this job).
  core-without-raylib:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (no game target)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DGRIDIRON_BUILD_GAME=OFF -DGRIDIRON_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # Formatting must match .clang-format. The version is pinned because clang-format output
  # changes slightly between releases.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: pip install clang-format==19.1.5

      - name: Check formatting
        run: clang-format --dry-run --Werror src/core/*.h src/core/*.cpp src/platform/*.h src/platform/*.cpp tests/*.cpp
